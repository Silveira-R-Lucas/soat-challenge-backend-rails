name: Rails CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE_NAME: container-registry.br-se1.magalu.cloud/soat-challenge-2/soat_tech_challenge

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soat_challenge_fase_01_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true

      - name: Lint code with RuboCop
        run: bundle exec rubocop -f github

      - name: Security Scan with Brakeman
        run: bundle exec brakeman --no-pager

      - name: Run RSpec tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/soat_challenge_fase_01_test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec rails db:prepare
          bundle exec rspec

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOSTNAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          # A imagem é marcada com o hash do commit para um versionamento único
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} .
          docker push $DOCKER_IMAGE_NAME:${{ github.sha }}
          docker tag $DOCKER_IMAGE_NAME:${{ github.sha }} $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

      - name: Get Secrets from AWS Secrets Manager
        id: get-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            KUBE_CONFIG_CONTENT, soat/k8s/kubeconfig
            RAILS_DATABASE_URL, soat/db/database_url

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ steps.get-secrets.outputs.KUBE_CONFIG_CONTENT }}" > $HOME/.kube/config

      - name: Create/Update Kubernetes Secrets
        run: |
          kubectl create secret generic rails-app-secrets \
            --from-literal=IDENTIFY_CLIENT_FUNCTION_URL='${{ vars.IDENTIFY_CLIENT_FUNCTION_URL }}' \
            --from-literal=CREATE_USER_FUNCTION_URL='${{ vars.CREATE_USER_FUNCTION_URL }}' \
            --from-literal=MERCADOPAGO_SECRET='${{ secrets.MERCADOPAGO_SECRET }}' \
            --from-literal=MERCADOPAGO_NOTIFICATION_URL='${{ vars.MERCADOPAGO_NOTIFICATION_URL }}' \
            --from-literal=MERCADOPAGO_EXTERNAL_POS_ID='${{ secrets.MERCADOPAGO_EXTERNAL_POS_ID }}' \
            --from-literal=MERCADOPAGO_USER_ID='${{ secrets.MERCADOPAGO_USER_ID }}' \
            --from-literal=MERCADOPAGO_TOKEN='${{ secrets.MERCADOPAGO_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          sudo mv kustomize /usr/local/bin/
          
          cd k8s 
          
          kustomize edit set image $DOCKER_IMAGE_NAME:${{ github.sha }}
          
          kustomize build . | kubectl apply -f -